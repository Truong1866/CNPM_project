name: Build and Package

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact-name: app-linux
            build-command: mvn clean package
          - os: macos-latest
            artifact-name: app-macos
            build-command: mvn clean package
          - os: windows-latest
            artifact-name: app-windows.exe
            build-command: mvn clean package

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: ${{ matrix.build-command }}

    - name: Run JavaFX jlink (create runtime image with bundled JVM)
      run: mvn javafx:jlink

    - name: List build artifacts
      run: |
        echo "=== Target directory ==="
        ls -la target/ || dir target

    - name: Upload artifacts (Linux)
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: target/app/

    - name: Upload artifacts (macOS)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: target/app/

    - name: Upload artifacts (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: target/app/

    - name: Create Release Assets (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: target/app/**/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Status
      if: success()
      run: echo "✓ Build successful for ${{ matrix.os }}"

    - name: Build Failed
      if: failure()
      run: echo "✗ Build failed for ${{ matrix.os }}"
